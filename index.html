<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マリオと わけっこ！ くもんこたえあわせ 🍄✨</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'M PLUS Rounded 1c', sans-serif; }
    body {
      background-color: #5c94fc;
      margin: 0; padding: 15px;
      display: flex; flex-direction: column; align-items: center;
      color: #333; position: relative; overflow-x: hidden;
    }

    .card {
      background: #f8f9fa; border-radius: 20px; padding: 15px 12px;
      box-shadow: 0 8px 0 #1b4332, 0 12px 20px rgba(0,0,0,0.3);
      border: 5px solid #e71d36; max-width: 480px; width: 100%; text-align: center;
      position: relative;
    }

    h1 {
      color: #ff9f1c; font-size: 18px; margin: 0 0 10px 0;
      text-shadow: 2px 2px 0 #e71d36, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
    }

    /* 1. プリントのしき入力 */
    .section-box {
      background: #fff; border: 3px solid #000; border-radius: 14px;
      padding: 10px; margin-bottom: 12px; box-shadow: 0 3px 0 #ccc;
    }
    .box-title {
      font-size: 13px; font-weight: 900; color: #e71d36; margin-bottom: 6px;
    }

    .formula-row {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 22px; font-weight: 900;
    }

    input[type="number"] {
      font-size: 20px; font-weight: 900; text-align: center;
      border: 3px solid #000; border-radius: 10px; width: 55px; height: 42px;
      outline: none; background: #fff;
    }
    input[type="number"]:focus { border-color: #2ec4b6; background: #e0fbf6; }
    .ans-input { background: #fff3bf !important; }

    /* 2. 判定ボタン */
    .btn-check {
      background: #ff9f1c; color: #fff; border: 3px solid #000;
      border-radius: 14px; padding: 10px 20px; font-size: 18px; font-weight: 900;
      cursor: pointer; box-shadow: 0 5px 0 #c77700, 0 5px 0 #000;
      text-shadow: 1px 1px 0 #000; width: 100%; margin-top: 6px;
      transition: all 0.1s;
    }
    .btn-check:active { transform: translateY(4px); box-shadow: 0 1px 0 #000; }

    /* 3. キャラクターとコイン表示 */
    .kids-area {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
      gap: 6px; margin-top: 10px; min-height: 80px;
    }
    .char-block { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .char-card {
      width: 50px; height: 50px; background: #fff; border: 2px solid #000;
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-size: 24px; box-shadow: 0 2px 0 #000;
    }
    .char-coins { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; }
    .coin-dot {
      width: 14px; height: 14px; background: #ffd700; border: 2px solid #000;
      border-radius: 50%; display: inline-block; animation: pop 0.2s ease-out;
    }

    /* はなまる演出 */
    .hanamaru {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0);
      font-size: 100px; color: #e71d36; pointer-events: none; z-index: 100;
      text-shadow: 0 0 10px #fff;
    }
    .hanamaru.show { animation: hanamaruPop 1.2s forwards; }

    @keyframes hanamaruPop {
      0% { transform: translate(-50%, -50%) scale(0) rotate(-20deg); opacity: 0; }
      50% { transform: translate(-50%, -50%) scale(1.2) rotate(0deg); opacity: 1; }
      80% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.1) rotate(0deg); opacity: 0; }
    }
    @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }

    .msg-box { font-size: 16px; font-weight: 900; margin-top: 10px; min-height: 30px; }
    .msg-box.success { color: #2ec4b6; }
    .msg-box.wrong { color: #e71d36; }
  </style>
</head>
<body>

<div class="card">
  <div id="hanamaru" class="hanamaru">💮</div>

  <h1>📝 くもん こたえあわせ アシスタント</h1>

  <!-- ステップ1: プリントの問 -->
  <div class="section-box">
    <div class="box-title">① プリントのもんだい を 入力しよう</div>
    <div class="formula-row">
      <input type="number" id="pTotal" placeholder="22" value="22">
      <span>÷</span>
      <input type="number" id="pDivisor" placeholder="5" value="5">
    </div>
  </div>

  <!-- ステップ2: お子様が書いた答え -->
  <div class="section-box" style="background: #fff9db;">
    <div class="box-title">② じぶんで かいた こたえ</div>
    <div class="formula-row">
      <span>＝</span>
      <input type="number" id="pQuotient" class="ans-input" placeholder="4">
      <span style="font-size:14px;">あまり</span>
      <input type="number" id="pRemainder" class="ans-input" placeholder="2">
    </div>
    <button class="btn-check" onclick="checkAnswer()">✨ あってるかな？ チャレンジ！</button>
  </div>

  <!-- 結果表示・マリオたち -->
  <div id="msg" class="msg-box">プリントの答えを入力してボタンを押してね！</div>
  <div id="kidsArea" class="kids-area"></div>
</div>

<script>
  const CHARS = ['🍄', '👑', '🟢', '🦖', '🌟'];

  function checkAnswer() {
    const total = parseInt(document.getElementById('pTotal').value);
    const divisor = parseInt(document.getElementById('pDivisor').value);
    const userQ = parseInt(document.getElementById('pQuotient').value);
    const userR = parseInt(document.getElementById('pRemainder').value);

    const msg = document.getElementById('msg');
    const hanamaru = document.getElementById('hanamaru');
    const kidsArea = document.getElementById('kidsArea');

    if (isNaN(total) || isNaN(divisor) || isNaN(userQ) || isNaN(userR)) {
      msg.innerText = '⚠️ すべての すうじ を 入力してね！';
      msg.className = 'msg-box wrong';
      return;
    }

    // 正しい答えの計算
    const correctQ = Math.floor(total / divisor);
    const correctR = total % divisor;

    // キャラクター領域の描画
    kidsArea.innerHTML = '';
    for (let i = 0; i < divisor; i++) {
      const block = document.createElement('div');
      block.className = 'char-block';
      
      const card = document.createElement('div');
      card.className = 'char-card';
      card.innerText = CHARS[i % CHARS.length];

      const coins = document.createElement('div');
      coins.className = 'char-coins';
      // 入力された商の数だけコインを表示
      for (let c = 0; c < userQ; c++) {
        const dot = document.createElement('span');
        dot.className = 'coin-dot';
        coins.appendChild(dot);
      }

      block.appendChild(card);
      block.appendChild(coins);
      kidsArea.appendChild(block);
    }

    // 判定
    if (userQ === correctQ && userR === correctR) {
      // 大正解！
      hanamaru.className = 'hanamaru show';
      msg.innerText = `🎉 だいせいかい！ すごいぞ！ (${userQ}枚ずつ分けられて、あまりは${userR}枚！)`;
      msg.className = 'msg-box success';
      setTimeout(() => hanamaru.className = 'hanamaru', 1200);
    } else {
      // おしい！
      msg.innerText = `💦 おしい！ マリオたちと一緒に もういちど たしかめてみよう！`;
      msg.className = 'msg-box wrong';
    }
  }
</script>

</body>
</html>
