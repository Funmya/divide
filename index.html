<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マリオと わけっこ！ コインチャレンジ 🍄✨</title>

  <!-- Galaxy等のホーム画面追加用アイコン設定 -->
  <link rel="apple-touch-icon" href="peach-icon.png">
  <link rel="icon" type="image/png" href="peach-icon.png">
  <link rel="manifest" href="manifest.json">

  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'M PLUS Rounded 1c', sans-serif;
    }
    body {
      background-color: #5c94fc;
      background-image: 
        radial-gradient(circle at 10% 20%, #ffffff 0%, #ffffff 8%, transparent 9%),
        radial-gradient(circle at 15% 18%, #ffffff 0%, #ffffff 6%, transparent 7%),
        radial-gradient(circle at 85% 15%, #ffffff 0%, #ffffff 10%, transparent 11%);
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #333;
      position: relative;
      overflow-x: hidden;
    }

    .card {
      background: #f8f9fa;
      border-radius: 20px;
      padding: 15px 10px;
      box-shadow: 0 8px 0 #1b4332, 0 12px 20px rgba(0,0,0,0.3);
      border: 5px solid #e71d36;
      max-width: 500px;
      width: 100%;
      text-align: center;
      position: relative;
    }

    /* 正解時の背景演出 */
    .correct-circle-bg {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.2);
      width: 320px;
      height: 320px;
      border: 28px solid rgba(231, 29, 54, 0.35);
      border-radius: 50%;
      pointer-events: none;
      z-index: 100;
      opacity: 0;
    }
    .correct-circle-bg.play-anim {
      animation: circlePopFade 1.6s ease-out forwards;
    }

    @keyframes circlePopFade {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
      30% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
      70% { opacity: 0.8; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.2); }
    }

    h1 {
      color: #ff9f1c;
      font-size: 20px;
      line-height: 1.3;
      margin-top: 0;
      margin-bottom: 12px;
      text-shadow: 2px 2px 0 #e71d36, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    /* タイトル用キノコ画像 */
    .title-mushroom-img {
      height: 24px;
      width: auto;
      vertical-align: middle;
      object-fit: contain;
    }

    /* タイトル用コイン画像 */
    .title-coin-img {
      height: 24px;
      width: auto;
      vertical-align: middle;
      object-fit: contain;
    }

    /* 見出しインライン用コイン画像 */
    .inline-coin-img {
      height: 16px;
      width: auto;
      vertical-align: -2px;
      margin: 0 2px;
      object-fit: contain;
    }

    /* グリッドセル用コイン画像 */
    .coin-cell-img {
      width: 80%;
      height: 80%;
      object-fit: contain;
      pointer-events: none;
    }

    .formula-box {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 20px;
      font-weight: 900;
      color: #ffffff;
      background: #ff9f1c;
      padding: 10px;
      border-radius: 16px;
      border: 3px solid #000;
      box-shadow: inset 0 -4px 0 #c77700, 0 4px 0 #000;
      margin-bottom: 18px;
      text-shadow: 2px 2px 0 #000;
      position: relative;
      z-index: 20;
    }

    select {
      font-family: inherit;
      font-size: 18px;
      font-weight: 900;
      text-align: center;
      border: 3px solid #000;
      border-radius: 10px;
      outline: none;
      color: #000;
      background: #fff;
      padding: 2px 6px;
      cursor: pointer;
      box-shadow: 0 3px 0 #888;
      appearance: none;
      -webkit-appearance: none;
    }
    select:focus {
      border-color: #2ec4b6;
      background: #e0fbf6;
    }
    .ans-select { background-color: #fff3bf; }

    .rem-box {
      width: 45px;
      height: 38px;
      line-height: 32px;
      background-color: #2ec4b6;
      border: 3px solid #000;
      color: #fff;
      border-radius: 10px;
      display: inline-block;
      font-size: 18px;
      box-shadow: inset 0 -3px 0 #1b9aaa;
    }

    .btn-area {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      position: relative;
      z-index: 20;
    }
    .btn-reset {
      border: 3px solid #000;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 900;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.1s;
      color: white;
      text-shadow: 1px 1px 0 #000;
    }
    .btn-answer-reset {
      background: #e71d36;
      box-shadow: 0 4px 0 #9b0012, 0 4px 0 #000;
    }
    .btn-all-reset {
      background: #011627;
      box-shadow: 0 4px 0 #000;
    }
    .btn-reset:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #000;
    }

    .section-wrapper {
      position: relative;
      margin-top: 15px;
      width: 100%;
    }

    .section-title {
      position: absolute;
      top: -12px;
      left: 10px;
      font-size: 12px;
      font-weight: 900;
      color: #ffffff;
      background: #e71d36;
      padding: 2px 10px;
      border-radius: 8px;
      border: 2px solid #000;
      z-index: 30;
      box-shadow: 0 2px 0 #000;
      white-space: nowrap;
      display: none;
    }

    .display-section {
      background: #ffffff;
      border-radius: 16px;
      padding: 16px 12px;
      border: 3px solid #000;
      box-shadow: 0 4px 0 #ccc;
      position: relative;
      z-index: 20;
      display: flex;
      justify-content: flex-start;
      width: 100%;
      overflow: hidden;
    }

    .op-divider {
      font-size: 24px;
      font-weight: 900;
      color: #ff9f1c;
      text-shadow: 2px 2px 0 #000;
      margin: 4px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      position: relative;
      z-index: 20;
    }

    .equal-vertical {
      display: inline-flex;
      flex-direction: row;
      gap: 6px;
      align-items: center;
      justify-content: center;
    }
    .equal-vertical span {
      display: block;
      width: 5px;
      height: 20px;
      background-color: #e71d36;
      border: 2px solid #000;
      border-radius: 3px;
    }

    /* 左詰めで揃うコイングリッドレイアウト */
    .coins-grid-strict {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-start;
      width: 100%;
    }

    .coin-row-strict {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 0;
      width: 100%;
    }

    .coin-group-5 {
      display: flex;
      gap: 3px;
    }

    .coin-group-5 + .coin-group-5 {
      margin-left: 10px;
    }

    .coin-cell {
      width: clamp(24px, 7vw, 32px);
      height: clamp(24px, 7vw, 32px);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: all 0.2s;
      border: 2px solid transparent;
      position: relative;
      box-sizing: border-box;
    }

    .coin-cell.set-color-0 { background: #ffe3e3; border-color: #ff8787; }
    .coin-cell.set-color-1 { background: #d0ebff; border-color: #74c0fc; }
    .coin-cell.set-color-2 { background: #e6fcf5; border-color: #63e6be; }
    .coin-cell.set-color-3 { background: #fff9db; border-color: #ffd43b; }
    .coin-cell.set-color-4 { background: #f3d9fa; border-color: #da77f2; }
    .coin-cell.set-color-5 { background: #ffe8cc; border-color: #ffa8a8; }

    .coin-cell.is-remainder {
      background: #e0fbf6;
      border-color: #2ec4b6;
      filter: hue-rotate(180deg) saturate(1.5);
      animation: bounce 0.6s infinite alternate;
    }

    .coin-cell .set-badge {
      position: absolute;
      top: -7px;
      left: -3px;
      background: #e71d36;
      color: #fff;
      font-size: clamp(7px, 2vw, 9px);
      font-weight: 900;
      padding: 0px 3px;
      border-radius: 4px;
      border: 1px solid #000;
      white-space: nowrap;
      z-index: 10;
      pointer-events: none;
      line-height: 1.1;
    }

    .all-hearts-area, .grouped-area {
      min-height: 38px;
      width: 100%;
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    /* デフォルト（案内メッセージ用）：通常のフレックス表示 */
    .kids-area {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      min-height: 48px;
      width: 100%;
    }

    /* キャラクター配置時：1行5列のGrid表示 */
    .kids-area.is-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    /* キャラカード枠 */
    .char-card {
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 64px;
      margin: 0 auto;
      background: #ffffff;
      border: 2px solid #000;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 0 #000;
      padding: 4px;
      overflow: hidden;
    }
    .char-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .message-box {
      font-size: 16px;
      font-weight: 900;
      min-height: 40px;
      color: #e71d36;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
      text-shadow: 1px 1px 0 #fff;
      position: relative;
      z-index: 20;
    }
    .message-box.blue { color: #2ec4b6; }
    .message-box.warn { color: #ff9f1c; }

    /* ハテナブロック演出 */
    .block-anim-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 200;
      opacity: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .block-anim-container.play-anim {
      animation: containerFade 1.8s forwards;
    }

    .item-block-img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      position: relative;
      z-index: 2;
    }

    .block-anim-container.play-anim .item-block-img {
      animation: blockPunch 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* アイテム出現領域 */
    .item-pop-wrapper {
      position: absolute;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 160px;
      height: 160px;
    }

    /* キラッキラ光線エフェクト（スター用） */
    .sparkle-bg {
      position: absolute;
      width: 220px;
      height: 220px;
      background: conic-gradient(
        from 0deg,
        rgba(255, 223, 0, 0.9) 0deg 15deg,
        transparent 15deg 30deg,
        rgba(255, 223, 0, 0.9) 30deg 45deg,
        transparent 45deg 60deg,
        rgba(255, 223, 0, 0.9) 60deg 75deg,
        transparent 75deg 90deg,
        rgba(255, 223, 0, 0.9) 90deg 105deg,
        transparent 105deg 120deg,
        rgba(255, 223, 0, 0.9) 120deg 135deg,
        transparent 135deg 150deg,
        rgba(255, 223, 0, 0.9) 150deg 165deg,
        transparent 165deg 180deg,
        rgba(255, 223, 0, 0.9) 180deg 195deg,
        transparent 195deg 210deg,
        rgba(255, 223, 0, 0.9) 210deg 225deg,
        transparent 225deg 240deg,
        rgba(255, 223, 0, 0.9) 240deg 255deg,
        transparent 255deg 270deg,
        rgba(255, 223, 0, 0.9) 270deg 285deg,
        transparent 285deg 300deg,
        rgba(255, 223, 0, 0.9) 300deg 315deg,
        transparent 315deg 330deg,
        rgba(255, 223, 0, 0.9) 330deg 345deg,
        transparent 345deg 360deg
      );
      border-radius: 50%;
      opacity: 0;
      transform: scale(0);
      filter: drop-shadow(0 0 10px #fff) drop-shadow(0 0 20px #ffd700);
      pointer-events: none;
    }

    .item-pop-img {
      width: 160px;
      height: 160px;
      object-fit: contain;
      transform: scale(0);
      position: relative;
      z-index: 4;
    }

    /* 正解時のアニメーション（スター＋キラキラ光線） */
    .block-anim-container.play-correct .sparkle-bg {
      animation: sparkleRotatePop 1.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s forwards;
    }
    .block-anim-container.play-correct .item-pop-img {
      animation: itemPopUpLarge 1.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s forwards;
    }

    /* 不正解時のアニメーション（クッパ） */
    .block-anim-container.play-wrong .sparkle-bg {
      display: none;
    }
    .block-anim-container.play-wrong .item-pop-img {
      animation: itemPopUpLarge 1.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s forwards;
    }

    @keyframes containerFade {
      0% { opacity: 1; }
      85% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes blockPunch {
      0% { transform: translateY(0); }
      40% { transform: translateY(-28px); }
      100% { transform: translateY(0); filter: brightness(0.7); }
    }

    /* 拡大版ポップアップ */
    @keyframes itemPopUpLarge {
      0% { transform: translateY(0) scale(0.2); opacity: 0; }
      50% { transform: translateY(-130px) scale(1.2); opacity: 1; filter: drop-shadow(0 0 15px rgba(255, 223, 0, 0.8)); }
      75% { transform: translateY(-115px) scale(1.0); opacity: 1; }
      100% { transform: translateY(-120px) scale(1.1); opacity: 0; }
    }

    /* キラキラ光線の回転＆拡大演出 */
    @keyframes sparkleRotatePop {
      0% { transform: translateY(0) scale(0.2) rotate(0deg); opacity: 0; }
      50% { transform: translateY(-130px) scale(1.4) rotate(90deg); opacity: 0.9; }
      75% { transform: translateY(-115px) scale(1.2) rotate(135deg); opacity: 0.8; }
      100% { transform: translateY(-120px) scale(1.3) rotate(180deg); opacity: 0; }
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-4px); }
    }
  </style>
</head>
<body>

<div class="card">
  <div id="correctCircleBg" class="correct-circle-bg"></div>

  <!-- 演出アニメーション用領域 -->
  <div id="blockAnimContainer" class="block-anim-container">
    <img id="itemBlockImg" class="item-block-img" src="question-block.png" alt="ハテナブロック">
    <div class="item-pop-wrapper">
      <div id="sparkleBg" class="sparkle-bg"></div>
      <img id="itemPopImg" class="item-pop-img" src="star.png" alt="アイテム">
    </div>
  </div>

  <h1>
    <span><img src="mushroom.png" class="title-mushroom-img" alt="キノコ"> マリオと わけっこ！</span>
    <span>コインチャレンジ <img src="coin.png" class="title-coin-img" alt="コイン"></span>
  </h1>
  
  <div class="formula-box">
    <select id="total" onchange="onNumberChange()"></select>
    <span>÷</span>
    <select id="divisor" onchange="onNumberChange()"></select>
    <span>＝</span>
    <select id="quotient" class="ans-select" onchange="render()"></select>
    <span>あまり</span>
    <div id="remainder" class="rem-box">？</div>
  </div>

  <div class="btn-area">
    <button class="btn-reset btn-answer-reset" onclick="resetAnswerOnly()">🔄 こたえをけす</button>
    <button class="btn-reset btn-all-reset" onclick="resetAll()">💥 ぜんぶけす</button>
  </div>

  <!-- 1. 全体コイン -->
  <div class="section-wrapper">
    <div id="totalTitle" class="section-title"></div>
    <div class="display-section">
      <div class="all-hearts-area" id="allHeartsArea"></div>
    </div>
  </div>

  <div class="op-divider">÷</div>

  <!-- 2. キャラクター -->
  <div class="section-wrapper">
    <div id="kidsTitle" class="section-title"></div>
    <div class="display-section">
      <div class="kids-area" id="kidsArea"></div>
    </div>
  </div>

  <div class="op-divider">
    <div class="equal-vertical" title="＝">
      <span></span>
      <span></span>
    </div>
  </div>

  <!-- 3. グループ分け -->
  <div class="section-wrapper">
    <div id="groupTitle" class="section-title"></div>
    <div class="display-section" id="groupedSection">
      <div class="grouped-area" id="groupedArea"></div>
    </div>
  </div>

  <div class="message-box" id="message"></div>
</div>

<script>
  // キャラクター画像リスト（1人目〜9人目の順番）
  const CHARACTERS = [
    { name: 'マリオ', img: 'mario.png' },
    { name: 'ピーチ姫', img: 'peach-icon.png' },
    { name: 'ルイージ', img: 'luigi.png' },
    { name: 'ヨッシー', img: 'yoshi.png' },
    { name: 'ロゼッタ', img: 'rosalina.png' },
    { name: 'チコ', img: 'luma.png' },
    { name: 'クッパ', img: 'bowser.png' },
    { name: 'クッパJr', img: 'bowser-jr.png' },
    { name: 'フォックス', img: 'fox.png' }
  ];

  // MP3音声ファイル
  const correctAudio = new Audio('correct.mp3');
  const wrongAudio = new Audio('wrong.mp3');

  const totalSelect = document.getElementById('total');
  const divisorSelect = document.getElementById('divisor');
  const quotientSelect = document.getElementById('quotient');
  const remainderBox = document.getElementById('remainder');
  
  const totalTitle = document.getElementById('totalTitle');
  const kidsTitle = document.getElementById('kidsTitle');
  const groupTitle = document.getElementById('groupTitle');

  const allHeartsArea = document.getElementById('allHeartsArea');
  const kidsArea = document.getElementById('kidsArea');
  const groupedArea = document.getElementById('groupedArea');
  const message = document.getElementById('message');
  
  const blockAnimContainer = document.getElementById('blockAnimContainer');
  const itemPopImg = document.getElementById('itemPopImg');
  const correctCircleBg = document.getElementById('correctCircleBg');

  function playSound(audioObj) {
    if (audioObj) {
      audioObj.currentTime = 0;
      audioObj.play().catch(e => console.log('Audio play error:', e));
    }
  }

  function initSelects() {
    totalSelect.innerHTML = '<option value="">？</option>';
    for (let i = 1; i <= 99; i++) totalSelect.add(new Option(i, i));

    divisorSelect.innerHTML = '<option value="">？</option>';
    for (let i = 1; i <= 99; i++) divisorSelect.add(new Option(i, i));

    quotientSelect.innerHTML = '<option value="">？</option>';
    for (let i = 0; i <= 99; i++) quotientSelect.add(new Option(i, i));
  }

  function onNumberChange() {
    quotientSelect.value = '';
    render();
  }

  function resetAnswerOnly() {
    quotientSelect.value = '';
    render();
  }

  function resetAll() {
    totalSelect.value = '';
    divisorSelect.value = '';
    quotientSelect.value = '';
    render();
  }

  function triggerCorrectAnimation() {
    blockAnimContainer.className = 'block-anim-container';
    itemPopImg.src = 'star.png';
    
    void blockAnimContainer.offsetWidth;
    blockAnimContainer.classList.add('play-anim', 'play-correct');

    correctCircleBg.classList.remove('play-anim');
    void correctCircleBg.offsetWidth;
    correctCircleBg.classList.add('play-anim');

    playSound(correctAudio);
  }

  function triggerWrongAnimation() {
    blockAnimContainer.className = 'block-anim-container';
    itemPopImg.src = 'bowser-shadow.png';

    void blockAnimContainer.offsetWidth;
    blockAnimContainer.classList.add('play-anim', 'play-wrong');

    playSound(wrongAudio);
  }

  function createStrictCoinGrid(total, groupSize = null, maxGroups = null) {
    const grid = document.createElement('div');
    grid.className = 'coins-grid-strict';

    let currentRow = null;
    let currentGroup5 = null;

    const maxAllocatedCoins = (groupSize && maxGroups) ? groupSize * maxGroups : 0;

    for (let i = 0; i < total; i++) {
      if (i % 10 === 0) {
        currentRow = document.createElement('div');
        currentRow.className = 'coin-row-strict';
        grid.appendChild(currentRow);
      }

      if (i % 5 === 0) {
        currentGroup5 = document.createElement('div');
        currentGroup5.className = 'coin-group-5';
        currentRow.appendChild(currentGroup5);
      }

      const cell = document.createElement('div');
      cell.className = 'coin-cell';
      
      const coinImg = document.createElement('img');
      coinImg.src = 'coin.png';
      coinImg.alt = 'コイン';
      coinImg.className = 'coin-cell-img';
      cell.appendChild(coinImg);

      if (groupSize && groupSize > 0) {
        const setIndex = Math.floor(i / groupSize);

        if (i < maxAllocatedCoins && setIndex < maxGroups) {
          cell.classList.add(`set-color-${setIndex % 6}`);

          if (i % groupSize === 0) {
            const badge = document.createElement('span');
            badge.className = 'set-badge';
            badge.innerText = `セット${setIndex + 1}`;
            cell.appendChild(badge);
          }
        } else {
          cell.classList.add('is-remainder');
          if (i === maxAllocatedCoins) {
            const badge = document.createElement('span');
            badge.className = 'set-badge';
            badge.style.background = '#2ec4b6';
            badge.innerText = 'あまり';
            cell.appendChild(badge);
          }
        }
      }

      currentGroup5.appendChild(cell);
    }

    return grid;
  }

  function render() {
    const totalVal = totalSelect.value;
    const divisorVal = divisorSelect.value;
    const qVal = quotientSelect.value;

    const total = parseInt(totalVal);
    const divisor = parseInt(divisorVal);
    const q = parseInt(qVal);

    allHeartsArea.innerHTML = '';
    kidsArea.innerHTML = '';
    groupedArea.innerHTML = '';
    message.innerText = '';
    message.className = 'message-box';

    if (!isNaN(total) && total > 0) {
      totalTitle.innerHTML = `${total}枚のコイン<img src="coin.png" class="inline-coin-img" alt="コイン">を`;
      totalTitle.style.display = 'block';
      allHeartsArea.appendChild(createStrictCoinGrid(total));
    } else {
      totalTitle.style.display = 'none';
      allHeartsArea.innerHTML = '<span style="color:#888; font-size:13px;">「ぜんぶの コイン（÷のひだり）」を えらぼう！</span>';
    }

    if (!isNaN(divisor) && divisor > 0) {
      kidsTitle.innerText = `${divisor}人で分けると`;
      kidsTitle.style.display = 'block';

      kidsArea.classList.add('is-grid');

      for (let i = 0; i < divisor; i++) {
        const charInfo = CHARACTERS[i % CHARACTERS.length];
        const card = document.createElement('div');
        card.className = 'char-card';
        card.title = `${i + 1}人目: ${charInfo.name}`;

        const img = document.createElement('img');
        img.src = charInfo.img;
        img.alt = charInfo.name;

        card.appendChild(img);
        kidsArea.appendChild(card);
      }
    } else {
      kidsTitle.style.display = 'none';
      kidsArea.classList.remove('is-grid');
      kidsArea.innerHTML = '<span style="color:#888; font-size:13px;">「わける にんずう（÷の みぎ）」を えらぼう！</span>';
    }

    if (isNaN(total) || isNaN(divisor) || qVal === '' || isNaN(q)) {
      remainderBox.innerText = '？';
      groupTitle.style.display = 'none';
      groupedArea.innerHTML = '<span style="color:#888; font-size:13px;">「1人に くばる かず（＝の みぎ）」を えらぶと グループ分けするよ！</span>';
      
      if (!isNaN(total) && !isNaN(divisor)) {
        message.innerText = `ぜんぶで ${total}枚のコイン！1人に「なん枚ずつ」配る？`;
      }
      return;
    }

    const coloredCount = divisor * q;
    const rem = total - coloredCount;

    if (coloredCount <= total) {
      remainderBox.innerText = rem;
      groupTitle.innerText = `${q}枚ずつ配ってあまり${rem}`;
      groupTitle.style.display = 'block';

      groupedArea.appendChild(createStrictCoinGrid(total, q, divisor));

      if (rem > 0) {
        const canMakeMoreSets = Math.floor(rem / divisor);

        if (canMakeMoreSets > 0) {
          triggerWrongAnimation();
          message.innerText = `💡 まだ あと ${canMakeMoreSets}枚ずつ ふやせるよ！数を ふやしてみよう！`;
          message.classList.add('warn');
        } else {
          triggerCorrectAnimation();
          message.innerText = `✨ 1人に ${q}枚ずつ 配ると、あまりは ${rem}枚 になるよ！`;
          message.classList.add('blue');
        }
      } else {
        triggerCorrectAnimation();
        message.innerText = '🎉 PERFECT! ぴったり 分けられたね！★';
        message.classList.add('blue');
      }

    } else {
      triggerWrongAnimation();
      remainderBox.innerText = '0';
      groupTitle.innerText = `${q}枚ずつ配るとコインがたりない！`;
      groupTitle.style.display = 'block';

      groupedArea.appendChild(createStrictCoinGrid(total, q, divisor));

      const missingCount = coloredCount - total;
      message.innerText = `💦 あと ${missingCount}枚 コインが 足りないよ！`;
    }
  }

  initSelects();
  render();
</script>
</body>
</html>
